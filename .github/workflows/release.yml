#
# Builds the Linux packages: .deb, AppImage and Flatpak bundle.
#
# - Pushing a tag `vX.Y.Z` builds the three and publishes them in a GitHub release of that tag.
# - "Run workflow" (Actions tab) builds them for the current branch and keeps them as workflow
#   artifacts only, for testing before a release.

name: Linux packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deb-appimage:
    name: .deb and AppImage
    # The oldest supported runner: the packages then run on this glibc and anything newer.
    runs-on: ubuntu-22.04
    env:
      CC: gcc-12
      CXX: g++-12
      GCC_VER: "12"
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install dependencies
        env:
          JXL_ALLOW_NOBLE: 1
        run: |
          sudo add-apt-repository -y universe
          sudo add-apt-repository -y multiverse
          bash packaging/install-deps-ubuntu.sh
          sudo apt-get install -y dpkg-dev file wget
          sudo lensfun-update-data || true

      - name: Version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0+git$(date -u +%Y%m%d).$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          fi

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/lumivell \
            -DBINARY_PACKAGE_BUILD=ON \
            -DBUILD_CHANNEL=package-github \
            -DUSE_SENTRY=OFF \
            -DUSE_TELEMETRY=OFF \
            -DUSE_XMLLINT=OFF

      - name: Build
        run: cmake --build build --parallel "$(nproc)"

      - name: Fetch the AppImage tools
        run: |
          mkdir -p tools/appimage
          cd tools/appimage
          wget -q -O linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q -O linuxdeploy-plugin-gtk.sh \
            https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh
          wget -q -O appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x linuxdeploy linuxdeploy-plugin-gtk.sh appimagetool

      - name: Package
        run: packaging/linux/make-packages.sh build dist

      - uses: actions/upload-artifact@v4
        with:
          name: lumivell-deb-appimage
          path: |
            dist/*.deb
            dist/*.AppImage
          retention-days: 30

  flatpak:
    name: Flatpak
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install Flatpak tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder jq

      - name: Cache downloaded sources
        uses: actions/cache@v4
        with:
          path: .flatpak-builder/downloads
          key: flatpak-downloads-${{ hashFiles('packaging/flatpak/photos.lumivell.Lumivell.json') }}
          restore-keys: flatpak-downloads-

      - name: Build
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            export VERSION="${GITHUB_REF_NAME#v}"
          fi
          packaging/flatpak/build-flatpak.sh

      - uses: actions/upload-artifact@v4
        with:
          name: lumivell-flatpak
          path: build/flatpak/Lumivell-*-x86_64.flatpak
          retention-days: 30

  release:
    name: Publish the release
    if: github.ref_type == 'tag'
    needs: [deb-appimage, flatpak]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GitHub files a "~" in an asset name as "."; name them that way up front
          for f in dist/*; do case "$f" in *'~'*) mv -- "$f" "${f//\~/.}" ;; esac; done
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Lumivell ${GITHUB_REF_NAME#v}" \
            --generate-notes
